seed: 42 # 0, 10, 42, 75, 123
station: "ashok_vihar"           # any one from 17 stations
input_steps: 4           # T  (4 h history)
horizon: 1               # H  (predicts next hour)
split: {train: 0.70, val: 0.15, test: 0.15}   # chronological
model:
  hidden: 64
  heads: 2
  dropout: 0.3
train:
  epochs: 200
  batch_size: 32
  gcn_layers: 2
  gat_layers: 2
  lstm_layers: 1
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  patience: 20           # early stopping on validation RMSE
  num_workers: 4