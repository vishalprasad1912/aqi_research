seed: 42
station: "rohini"           # any one from 17 stations
input_steps: 24          # T (hours of history)
horizon: 8          # H (hours to forecast)
split: {train: 0.70, val: 0.15, test: 0.15}   # chronological, by rows
model:
  hidden: 32
  dropout: 0.0
train:
  epochs: 100
  batch_size: 64
  gcn_layers: 1
  gat_layers: 1
  lstm_layers: 2
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 3.0
  patience: 25     # early stopping on validation RMSE
  num_workers: 8