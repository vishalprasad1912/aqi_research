seed: 42 # 0, 10, 42, 75, 123
station: "rohini"           # any one from 17 stations
input_steps: 24           # T
horizon: 8               # H
split: {train: 0.70, val: 0.15, test: 0.15}   # chronological
model:
  hidden: 32
  heads: 2
  dropout: 0.1
train:
  epochs: 100
  batch_size: 64
  gcn_layers: 1
  gat_layers: 1
  lstm_layers: 2
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  patience: 15     # early stopping on validation RMSE
  num_workers: 4